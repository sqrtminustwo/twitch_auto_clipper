name: Unittests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run tests
        run: ./scripts/run_tests.sh
